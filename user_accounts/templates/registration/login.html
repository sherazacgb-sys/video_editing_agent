<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — min_vid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-gray-100 min-h-screen flex items-center justify-center font-sans">

  <div class="w-full max-w-sm">
    <!-- Logo / brand -->
    <div class="text-center mb-8">
      <span class="text-amber-400 font-semibold text-2xl tracking-tight">min_vid</span>
      <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <div class="bg-[#1e1e1e] border border-[#2a2a2a] rounded-xl p-6">

      {% if form.errors %}
        <!-- Show auth errors without revealing whether the username or password was wrong -->
        <p class="text-red-400 text-sm mb-4 bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2">
          Invalid username or password.
        </p>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-xs text-gray-400 mb-1 font-mono">Username</label>
            <input type="text" name="username" id="id_username" autocomplete="username" required
                   class="w-full bg-[#121212] border border-[#2a2a2a] rounded-lg px-3 py-2 text-sm text-gray-100
                          focus:outline-none focus:border-amber-500 transition-colors placeholder-gray-600">
          </div>

          <div>
            <label for="id_password" class="block text-xs text-gray-400 mb-1 font-mono">Password</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required
                   class="w-full bg-[#121212] border border-[#2a2a2a] rounded-lg px-3 py-2 text-sm text-gray-100
                          focus:outline-none focus:border-amber-500 transition-colors">
          </div>
        </div>

        <!-- Hidden next param so Django redirects correctly after login -->
        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit"
                class="mt-6 w-full bg-amber-500 hover:bg-amber-600 text-black text-sm font-semibold
                       py-2 rounded-lg transition-colors">
          Sign in
        </button>
      </form>
    </div>
  </div>

</body>
</html>
