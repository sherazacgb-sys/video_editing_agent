# Plain-HTTP server: only job is serving the Let's Encrypt ACME challenge (needed
# for both initial issuance and renewal) and bouncing everything else to HTTPS.
server {
    listen 80;
    server_name sherazlabs.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sherazlabs.co.uk;

    ssl_certificate /etc/letsencrypt/live/sherazlabs.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sherazlabs.co.uk/privkey.pem;
    # Certbot-managed recommended TLS params (protocols/ciphers) and DH params —
    # fetched once by nginx/init-letsencrypt.sh, not shipped in this repo.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Video uploads can be large; Django's own upload-size limits still apply
    # behind this, this just stops nginx itself from rejecting the request first.
    client_max_body_size 1024M;

    # Serve collectstatic's output directly instead of proxying it to gunicorn —
    # nginx does this far more efficiently than the Django dev/app server would.
    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Django (via SECURE_PROXY_SSL_HEADER in settings.py) that the
        # original request was HTTPS, even though this hop to gunicorn is plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
